com.intelliplatforms.bizevents.disableSslVerification: true
com.intelliplatforms.bizevents.logLevel: DEBUG
#resilience4j.circuitbreaker.metrics.use_legacy_binder: true

resilience4j.circuitbreaker:
    configs:
        default:
            registerHealthIndicator: true
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            permittedNumberOfCallsInHalfOpenState: 3
            automaticTransitionFromOpenToHalfOpenEnabled: true
            waitDurationInOpenState: 5s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
            recordExceptions:
                - org.springframework.web.client.HttpServerErrorException
                - java.util.concurrent.TimeoutException
                - java.io.IOException
            ignoreExceptions:
                - io.github.robwin.exception.BusinessException
        shared:
            slidingWindowSize: 100
            permittedNumberOfCallsInHalfOpenState: 30
            waitDurationInOpenState: 1s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
            ignoreExceptions:
                - io.github.robwin.exception.BusinessException
    instances:
        backendA:
            baseConfig: default
        backendB:
            registerHealthIndicator: true
            slidingWindowSize: 10
            minimumNumberOfCalls: 10
            permittedNumberOfCallsInHalfOpenState: 3
            waitDurationInOpenState: 5s
            failureRateThreshold: 50
            eventConsumerBufferSize: 10
            recordFailurePredicate: io.github.robwin.exception.RecordFailurePredicate
        # Mainframe system of record: trips on slow calls, not errors (see BankingLedgerService)
        core-banking-ledger:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            slowCallDurationThreshold: 1500ms
            slowCallRateThreshold: 50
            waitDurationInOpenState: 15s
        # Real-time fraud model: trips on its failure rate, from TimeoutExceptions thrown by the fraud-scoring TimeLimiter
        fraud-scoring:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            permittedNumberOfCallsInHalfOpenState: 5
            waitDurationInOpenState: 10s
        # SWIFT gateway: trips on its failure rate during error bursts; validation rejects (BusinessException) are ignored
        swift-gateway:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 8
            failureRateThreshold: 40
            permittedNumberOfCallsInHalfOpenState: 4
            waitDurationInOpenState: 20s
        # Non-critical notification hub: fails 25-45% of the time on a normal day, so the threshold is 80%;
        # only a real outage opens it. HTTP 429 is a 4xx, so it must be listed here to count as a failure.
        notification-service:
            baseConfig: default
            slidingWindowSize: 30
            minimumNumberOfCalls: 15
            failureRateThreshold: 80
            permittedNumberOfCallsInHalfOpenState: 3
            waitDurationInOpenState: 30s
            recordExceptions:
                - org.springframework.web.client.HttpServerErrorException
                - org.springframework.web.client.HttpClientErrorException$TooManyRequests
                - java.util.concurrent.TimeoutException
                - java.io.IOException
        # Customer profile / KYC: the healthy baseline; stays CLOSED unless switched to DEGRADED or DOWN
        customer-profile:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            waitDurationInOpenState: 15s
        # Sanctions screening: fail-closed compliance check, so the strictest threshold (25%).
        # Each retry attempt is recorded separately, so reload-window errors open it quickly.
        sanctions-screening:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            failureRateThreshold: 25
            permittedNumberOfCallsInHalfOpenState: 5
            waitDurationInOpenState: 30s
        # FX market data: a 200 OK with a stale or off-market quote is a failure too, so InvalidQuoteException
        # is added to this instance's recordExceptions alongside the usual HTTP/IO errors.
        fx-rates:
            baseConfig: default
            slidingWindowSize: 20
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            permittedNumberOfCallsInHalfOpenState: 3
            waitDurationInOpenState: 20s
            recordExceptions:
                - org.springframework.web.client.HttpServerErrorException
                - java.util.concurrent.TimeoutException
                - java.io.IOException
                - io.github.robwin.exception.InvalidQuoteException
resilience4j.retry:
    configs:
        default:
            maxAttempts: 3
            waitDuration: 100
            retryExceptions:
                - org.springframework.web.client.HttpServerErrorException
                - java.util.concurrent.TimeoutException
                - java.io.IOException
            ignoreExceptions:
                - io.github.robwin.exception.BusinessException
    instances:
        backendA:
            baseConfig: default
        backendB:
            baseConfig: default
        # Two quick retries (250ms, then 500ms) before holding a payment for compliance review.
        # CallNotPermittedException isn't in retryExceptions, so an OPEN breaker stops retries immediately.
        sanctions-screening:
            baseConfig: default
            maxAttempts: 3
            waitDuration: 250ms
            enableExponentialBackoff: true
            exponentialBackoffMultiplier: 2
resilience4j.bulkhead:
    configs:
        default:
            maxConcurrentCalls: 100
    instances:
        backendA:
            maxConcurrentCalls: 10
        backendB:
            maxWaitDuration: 10ms
            maxConcurrentCalls: 20

resilience4j.thread-pool-bulkhead:
    configs:
        default:
            maxThreadPoolSize: 4
            coreThreadPoolSize: 2
            queueCapacity: 2
    instances:
        backendA:
            baseConfig: default
        backendB:
            maxThreadPoolSize: 1
            coreThreadPoolSize: 1
            queueCapacity: 1

resilience4j.ratelimiter:
    configs:
        default:
            registerHealthIndicator: false
            limitForPeriod: 10
            limitRefreshPeriod: 1s
            timeoutDuration: 0
            eventConsumerBufferSize: 100
    instances:
        backendA:
            baseConfig: default
        backendB:
            limitForPeriod: 6
            limitRefreshPeriod: 500ms
            timeoutDuration: 3s

# Core banking ledger latency simulation (BankingLedgerService)
# mode: HEALTHY | DEGRADED | SCHEDULED. SCHEDULED is slow during the last batch-window of every cycle-length.
# Change at runtime with: PUT /ledger/mode/{mode}
banking-ledger.simulation:
    mode: SCHEDULED
    cycle-length: 10m
    batch-window: 3m
    slow-call-probability: 0.8

# Fraud scoring load simulation (FraudScoringService)
# mode: NORMAL | PEAK | SCHEDULED. SCHEDULED ramps load up to peak-load and back down during the last
# peak-window of every cycle-length. Change at runtime with: PUT /fraud/mode/{mode}
fraud-scoring.simulation:
    mode: SCHEDULED
    cycle-length: 12m
    peak-window: 4m
    peak-load: 40

# SWIFT gateway error-burst simulation (SwiftGatewayService)
# mode: HEALTHY | BURSTY | OUTAGE. BURSTY starts error bursts at random times (exponential gaps around the mean).
# Queued payments are replayed from the outbox every outbox-replay-interval while the breaker is CLOSED.
# Change at runtime with: PUT /swift/mode/{mode}
swift-gateway.simulation:
    mode: BURSTY
    mean-time-between-bursts: 4m
    burst-min: 60s
    burst-max: 150s
    burst-error-probability: 0.85
    baseline-error-probability: 0.02
    reject-probability: 0.03
    outbox-replay-interval: 10s

# Notification hub simulation (NotificationService)
# mode: HEALTHY | FLAKY | OUTAGE. FLAKY fails each channel at its everyday rate, plus random hub-wide outages.
# rate-limit-share is the fraction of failures that are HTTP 429; the rest are 503s and dropped connections.
# Change at runtime with: PUT /notifications/mode/{mode}
notification-service.simulation:
    mode: FLAKY
    sms-failure-probability: 0.45
    email-failure-probability: 0.25
    push-failure-probability: 0.30
    rate-limit-share: 0.6
    mean-time-between-outages: 8m
    outage-min: 90s
    outage-max: 180s

# Customer profile simulation (CustomerProfileService)
# mode: HEALTHY | DEGRADED | DOWN. HEALTHY is the baseline; switch modes by hand to show an incident on demand.
# The fallback serves cached profiles up to max-cache-staleness old, then a fail-safe default.
# Change at runtime with: PUT /customers/mode/{mode}
customer-profile.simulation:
    mode: HEALTHY
    baseline-error-probability: 0.005
    degraded-error-probability: 0.5
    max-cache-staleness: 30m

# Sanctions screening simulation (SactionsScreeningService)
# mode: HEALTHY | SCHEDULED | DOWN. SCHEDULED reloads the watchlist during the last refresh-window of every
# cycle-length, when most calls fail with HTTP 503. Change at runtime with: PUT /sanctions/mode/{mode}
sanctions-screening.simulation:
    mode: SCHEDULED
    cycle-length: 15m
    refresh-window: 2m
    refresh-error-probability: 0.7
    baseline-error-probability: 0.01
    potential-match-probability: 0.03

# FX rate simulation (ForeignExchangeRateService)
# mode: HEALTHY | FLAKY | FROZEN | DOWN. FLAKY has 2% HTTP errors, rare off-market ticks, and random feed
# freezes where quotes go stale after max-quote-age. Cached rates are used up to cache-ttl old.
# Change at runtime with: PUT /fx/mode/{mode}
fx-rates.simulation:
    mode: FLAKY
    max-quote-age: 5s
    off-market-threshold: 0.03
    cache-ttl: 10m
    baseline-error-probability: 0.02
    off-market-probability: 0.01
    mean-time-between-freezes: 6m
    freeze-min: 60s
    freeze-max: 150s

resilience4j.timelimiter:
    configs:
        default:
            cancelRunningFuture: false
            timeoutDuration: 2s
    instances:
        backendA:
            baseConfig: default
        backendB:
            baseConfig: default
        # A payment can't wait long for a fraud score; past 1s the rules fallback decides instead
        fraud-scoring:
            baseConfig: default
            timeoutDuration: 1s
            cancelRunningFuture: true