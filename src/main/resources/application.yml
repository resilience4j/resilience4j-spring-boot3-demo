spring:
    application.name: payment-orchestration-service
    jackson.serialization.indent_output: true

server:
    port: ${PORT}

management.endpoints.web.exposure.include: '*'
management.endpoint.health.show-details: always

management.health.diskspace.enabled: false
management.health.circuitbreakers.enabled: true
management.health.ratelimiters.enabled: false

management.dynatrace.metrics.export:
    enabled: true
    enrich-with-dynatrace-metadata: true
    v2:
        export-meter-metadata: false
        default-dimensions:
            region: ${metrics.region}
logging:
    level:
        io:
            micrometer:
                dynatrace: DEBUG
info:
    name: ${spring.application.name}
    description: resilience4j demo
    environment: ${spring.profiles.active}
    version: 0.0.1

management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.percentiles-histogram.resilience4j.circuitbreaker.calls: true

com.intelliplatforms.bizevents.enabled: false
com.intelliplatforms.bizevents.applicationId: cf0411aa-00ed-4c07-9ad2-358aaa7685aa
com.intelliplatforms.bizevents.deviceId: 123

com.intelliplatforms.bizevents.endpointUrl: https://DESKTOP-GEQUNFQ:9999/mbeacon/hkh71453
com.intelliplatforms.bizevents.manufacturer: TranslucentAI
com.intelliplatforms.bizevents.applicationName: translucent-ai-claims-processor-springboot
com.intelliplatforms.bizevents.applicationVersion: 1.0.0
com.intelliplatforms.bizevents.operatingSystem: company-k8s-cluster
